[project]
name = "atmosfera-worker"
version = "0.1.0"
description = "Worker local do Atmosfera Pipeline — claim na fila, render, publicação."
# ADR-01: Python 3.11 fixo. O MoneyPrinterTurbo é Python, e a Sprint 2 vai
# compartilhar dependência com ele — versão solta aqui vira dor lá.
requires-python = ">=3.11,<3.12"

dependencies = [
    "supabase>=2.15.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",  # cliente HTTP do MoneyPrinterTurbo (mpt.py)
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "tzdata>=2024.1",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
