<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retorno do TikTok — Atmosfera</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0b0d; color: #ececec; padding: 24px;
    }
    main { max-width: 560px; width: 100%; }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
    p  { font-size: .9rem; line-height: 1.5; color: #a9a9ad; margin: 0 0 16px; }
    .url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .8rem; word-break: break-all; background: #17171b;
      border: 1px solid #2a2a30; border-radius: 10px; padding: 14px; margin: 0 0 12px;
    }
    button {
      width: 100%; min-height: 48px; border: 0; border-radius: 10px;
      background: #e4e4e7; color: #0b0b0d; font-size: 1rem; font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .ok { color: #7ee787; }
    .aviso { color: #f0a24d; }
  </style>
</head>
<body>
  <main>
    <h1>亡者 · retorno do TikTok</h1>
    <p>Copie a URL abaixo <strong>inteira</strong> e cole no terminal onde
       <code>autorizar_tiktok.py</code> está esperando.</p>
    <div class="url" id="url">carregando…</div>
    <button id="copiar">Copiar URL</button>
    <p id="status" style="margin-top:12px"></p>
  </main>
  <script>
    var url = window.location.href;
    document.getElementById('url').textContent = url;
    var status = document.getElementById('status');
    if (url.indexOf('code=') === -1) {
      status.textContent = 'Aviso: não encontrei "code=" nesta URL. Autorize pelo link do terminal primeiro.';
      status.className = 'aviso';
    }
    document.getElementById('copiar').addEventListener('click', function () {
      navigator.clipboard.writeText(url).then(function () {
        status.textContent = 'Copiado. Cole no terminal.';
        status.className = 'ok';
      }, function () {
        status.textContent = 'Não consegui copiar automático — selecione a URL acima à mão.';
        status.className = 'aviso';
      });
    });
  </script>
</body>
</html>
